name: Auto-Build CLIProxyAPI Module

on:
  schedule:
    # 每 3 小时轮询一次上游上游 (router-for-me/CLIProxyAPI) 是否有新 release
    - cron: "23 */3 * * *"
  workflow_dispatch: {}
  # 手动触发：仓库 → Actions → Build Module → Run workflow

permissions:
  contents: write   # 允许动作推送 latest_version / update.json 并创建 release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (module template + scripts)
        uses: actions/checkout@v4

      - name: Build & publish module if new upstream release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash ./build.sh